<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- English-Listen-WinUI icon: ink headphones on warm paper, single amber sound bar (纸笔听写/精听训练) -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFAF6"/>
      <stop offset="1" stop-color="#ECE9E1"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fluent: warm paper rounded square, soft grain-free -->
  <rect width="512" height="512" rx="112" fill="url(#paper)"/>
  <!-- hairline for definition on light Start menu -->
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#000000" stroke-opacity="0.05" stroke-width="2"/>
  <!-- soft Fluent depth: radial shadow under glyph -->
  <ellipse cx="256" cy="416" rx="170" ry="30" fill="url(#shadow)"/>
  <!-- ink headband -->
  <path d="M136 288 V264 A120 120 0 0 1 376 264 V288" fill="none" stroke="#232326" stroke-width="36" stroke-linecap="round"/>
  <!-- ink ear cups -->
  <rect x="100" y="260" width="72" height="128" rx="36" fill="#232326"/>
  <rect x="340" y="260" width="72" height="128" rx="36" fill="#232326"/>
  <!-- equalizer: two ink bars + center amber accent -->
  <rect x="201" y="214" width="26" height="84" rx="13" fill="#232326"/>
  <rect x="243" y="192" width="26" height="128" rx="13" fill="#D97706"/>
  <rect x="285" y="214" width="26" height="84" rx="13" fill="#232326"/>
</svg>
