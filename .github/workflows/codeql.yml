name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: 构建（Release x64，不签名）
        shell: pwsh
        run: |
          & dotnet build English-Listen-WinUI.csproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:csharp'
