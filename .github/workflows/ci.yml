name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Write redeem codes config (secret stays out of the repo; empty placeholder when the secret is missing, e.g. fork PRs)
        shell: pwsh
        env:
          REDEEM_CODES: ${{ secrets.REDEEM_CODES }}
        run: |
          if (-not $env:REDEEM_CODES) {
            '{"RedeemCodes":[]}' | Set-Content Config\redeem_codes.json -Encoding utf8
          } else {
            Set-Content Config\redeem_codes.json -Value $env:REDEEM_CODES -Encoding utf8 -NoNewline
          }

      - name: Build (Debug x64, unsigned in CI)
        shell: pwsh
        run: |
          & dotnet build English-Listen-WinUI.csproj -c Debug -p:Platform=x64 -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
