version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Group updates of the same type into one PR, max 3 open PRs
    open-pull-requests-limit: 3
    groups:
      nuget-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
