name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Write redeem codes config (secret stays out of the repo; empty placeholder when the secret is missing)
        shell: pwsh
        env:
          REDEEM_CODES: ${{ secrets.REDEEM_CODES }}
        run: |
          if (-not $env:REDEEM_CODES) {
            '{"RedeemCodes":[]}' | Set-Content Config\redeem_codes.json -Encoding utf8
          } else {
            Set-Content Config\redeem_codes.json -Value $env:REDEEM_CODES -Encoding utf8 -NoNewline
          }

      - name: Build x86 / x64 / ARM64 (Release, unsigned)
        shell: pwsh
        run: |
          foreach ($plat in 'x86','x64','ARM64') {
            & dotnet build English-Listen-WinUI.csproj -c Release -p:Platform=$plat
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Bundle, sign, export cert
        shell: pwsh
        env:
          DEVCERT_PASSWORD: ${{ secrets.DEVCERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          [xml]$manifest = Get-Content Package.appxmanifest
          $version = $manifest.Package.Identity.Version
          Write-Host "Packaging version $version"

          # 收集三架构 msix，重新打成一个 bundle（csproj 的 AppxBundle=Always 每次只含单架构）
          $pkgDir = New-Item -ItemType Directory -Path bundle -Force
          Get-ChildItem AppPackages -Recurse -Filter *.msix | Copy-Item -Destination $pkgDir
          $archCount = (Get-ChildItem $pkgDir -Filter *.msix).Count
          if ($archCount -ne 3) { throw "expected 3 msix (x86/x64/ARM64), found $archCount" }

          $sdkBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $makeappx = Join-Path $sdkBin 'makeappx.exe'
          $signtool = Join-Path $sdkBin 'signtool.exe'

          $bundleName = "English-Listen-WinUI_$($version)_x86_x64_ARM64.msixbundle"
          & $makeappx bundle /v /d $pkgDir.FullName /p $bundleName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 未签名副本：Partner Center 上传用（商店会重新签名）
          Copy-Item $bundleName "English-Listen-WinUI_$($version)_unsigned.msixbundle"

          & $signtool sign /fd SHA256 /f devcert.pfx /p $env:DEVCERT_PASSWORD $bundleName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 公钥证书：最终用户安装到“受信任人”后才能装 devcert 签名的包
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            "$PWD\devcert.pfx", $env:DEVCERT_PASSWORD)
          [IO.File]::WriteAllBytes("$PWD\devcert.cer", $cert.Export('Cert'))

          "BUNDLE=$bundleName" >> $env:GITHUB_ENV
          "BUNDLE_UNSIGNED=English-Listen-WinUI_$($version)_unsigned.msixbundle" >> $env:GITHUB_ENV
          "CER=devcert.cer" >> $env:GITHUB_ENV
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## English Listen v${{ env.APP_VERSION }}

            ### 安装（GitHub 下载版）

            1. 下载 `devcert.cer`，双击安装到 **本地计算机 → 受信任人**（开发证书，仅用于校验本页分发的包）
            2. 下载 `.msixbundle`，双击安装（含 x86 / x64 / ARM64 三架构，Windows 10 17763+）
            3. 若之前装过 Microsoft Store 版，请先卸载再安装本版（签名不同，会互相覆盖失败）

            ### 文件说明

            | 文件 | 用途 |
            |---|---|
            | `*_x86_x64_ARM64.msixbundle` | 签名安装包（个人用户下载这个） |
            | `*_unsigned.msixbundle` | 未签名包（Partner Center / 商店上传用，勿直接安装） |
            | `devcert.cer` | 开发者证书公钥 |
          files: |
            ${{ env.BUNDLE }}
            ${{ env.BUNDLE_UNSIGNED }}
            ${{ env.CER }}
          generate_release_notes: true
